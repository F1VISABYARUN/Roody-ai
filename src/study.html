<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Study with Roody</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #fdf6ec;
      color: #3a2c1e;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      background: #fffaf3;
      border-bottom: 1px solid #f0e2cf;
    }
    header .orb { font-size: 22px; }
    header h1 { font-size: 16px; margin: 0; font-weight: 800; }
    header .sub { font-size: 12px; color: #8a7560; margin-top: 2px; }
    #drop {
      margin: 16px 18px 0;
      border: 2px dashed #e7d4ba;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
      color: #8a7560;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    #drop.hot { border-color: #e98a3c; background: #fff3e6; }
    #drop strong { color: #3a2c1e; }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .you { align-self: flex-end; background: #e98a3c; color: #fff; border-bottom-right-radius: 4px; }
    .roody { align-self: flex-start; background: #fff; border: 1px solid #f0e2cf; border-bottom-left-radius: 4px; }
    footer {
      display: flex;
      gap: 8px;
      padding: 12px 18px;
      background: #fffaf3;
      border-top: 1px solid #f0e2cf;
    }
    footer button {
      border: 1px solid #e7d4ba;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      font-size: 17px;
      padding: 0 12px;
    }
    footer button:hover { border-color: #e98a3c; background: #fff3e6; }
    #mic.on { background: #e98a3c; color: #fff; border-color: #e98a3c; }
    #text {
      flex: 1;
      border: 1px solid #e7d4ba;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }
    #text:focus { border-color: #e98a3c; }
    #send { background: #e98a3c; color: #fff; border-color: #e98a3c; width: 46px; }
  </style>
</head>
<body>
  <header>
    <span class="orb">🟠</span>
    <div>
      <h1>Study with Roody</h1>
      <div class="sub" id="sub">Drop a PDF or click 📄 — I'll read it and we'll talk it through.</div>
    </div>
  </header>

  <div id="drop">📄 <strong>Drop a PDF here</strong> or click to pick one from your computer</div>

  <div id="log"></div>

  <footer>
    <button id="pdf" title="Load a PDF">📄</button>
    <button id="mic" title="Talk to Roody">🎙️</button>
    <input id="text" type="text" placeholder="Ask Roody about the document…" autocomplete="off" />
    <button id="send" title="Send">➤</button>
    <input id="pdf-file" type="file" accept="application/pdf,.pdf" style="display:none" />
  </footer>

  <script src="pdf.js"></script>
  <script src="study.js"></script>
</body>
</html>
