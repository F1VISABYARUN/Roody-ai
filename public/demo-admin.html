<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roody demo access</title>
<style>body{max-width:480px;margin:48px auto;padding:20px;font:16px/1.6 system-ui;background:#0e201b;color:#eafff7}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #517266;background:#16352a;color:inherit}button{background:#a5f6d5;color:#10291f;cursor:pointer}output{display:block;overflow-wrap:anywhere}small{color:#afc9c2}</style></head>
<body><h1>Give someone a Roody demo</h1><p>Each code gets 100 demo credits. Text costs 1 credit; a voice session costs 30 credits and lasts up to 3 minutes.</p><form id="form"><label for="admin">Your admin password</label><input id="admin" type="password" autocomplete="off" required><button>Create a demo code</button></form><output id="result" role="status"></output><small>The OpenAI key belongs in Vercel environment variables. This page only needs ADMIN_KEY. Codes have a shared balance if given to more than one person.</small>
<script>document.getElementById('form').addEventListener('submit',async event=>{event.preventDefault();const output=document.getElementById('result');const input=document.getElementById('admin');const button=event.target.querySelector('button');button.disabled=true;output.textContent='Creating…';try{const response=await fetch('/api/demo',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+input.value},body:JSON.stringify({action:'mint'})});const data=await response.json();output.textContent=data.ok?'Demo code: '+data.code+' — give the guest this code and '+location.origin:data.error;}catch{output.textContent='Could not reach the server.'}finally{input.value='';button.disabled=false}});</script></body></html>
